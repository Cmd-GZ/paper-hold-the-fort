name: HoldTheFort
version: '${version}'
main: io.github.cmdgz.holdthefort.HoldTheFortPlugin
description: 战线模式 —— 两队围绕一条横贯战场的战线对抗
authors: [Cmd-GZ]
api-version: '26.2'

# 与其它 23 个小游戏一致：编译期 provided 依赖 MiniGameLib，运行期硬依赖 MiniGameLib + HubCore。
# HubAPI（主城对接：tab 状态、重生不回主城）与 Worlds（世界 token）都在 MiniGameLib 里，
# 所以这两个依赖不再是"可选"。GameWorlds 只是加载顺序用，保持 softdepend。
depend: [MiniGameLib, HubCore]
softdepend: [GameWorlds]
minigame-game: true
minigame:
  name: 战线模式
  icon: SHIELD
  color: 'c'
permissions:
  htf.use:
    description: 使用 /htf join 等玩家命令
    default: true
  htf.setup:
    description: 游戏内建场（/htf setup）
    default: op

commands:
  htf:
    description: 战线模式调试命令
    usage: |
      /htf join [red|blue] | /htf leave | /htf start | /htf stop
      /htf setup [spawn red|blue | undo | start <编号> | done | cancel]
      /htf build <地图名>   （在你所在的世界铺平整战场；控制台则铺在地图声明的世界）
